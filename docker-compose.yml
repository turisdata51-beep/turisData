services:
  db:
    image: postgres:17-alpine
    container_name: observatorio_db
    environment:
      POSTGRES_DB: observatorio
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-observatorio_dev}
    ports:
      - "5433:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
      # Todos los scripts de db/ se ejecutan en orden numérico, solo la primera vez (volumen vacío)
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatorio -d observatorio"]
      interval: 5s
      retries: 10

volumes:
  datos_db:
